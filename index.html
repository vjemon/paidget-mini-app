<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paidget Gateway - Lamp Login</title>
  <!-- Telegram Web App SDK Connector -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121417;
      overflow: hidden;
      transition: background 0.4s ease;
    }

    .main-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
    }

    /* Lamp Setup */
    .lamp-wrapper {
      position: relative;
      width: 200px;
      height: 140px;
      display: flex;
      justify-content: center;
      z-index: 5;
    }

    .lamp-svg {
      width: 100%;
      height: 100%;
    }

    .lamp-shade {
      fill: #2a2d32;
      transition: fill 0.3s ease;
    }

    .bulb {
      fill: #444;
      transition: fill 0.3s ease, filter 0.3s ease;
    }

    /* Pull Cord Animation */
    .cord-hit {
      position: absolute;
      top: 70px;
      right: 65px;
      width: 20px;
      height: 50px;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease;
    }

    .cord-line {
      width: 2px;
      height: 40px;
      background: #888;
      margin: 0 auto;
    }

    .cord-bead {
      width: 8px;
      height: 8px;
      background: #d4a373;
      border-radius: 50%;
      margin: -1px auto 0;
    }

    /* Light Cone Gradient */
    .light-cone {
      position: absolute;
      top: 75px;
      width: 360px;
      height: 420px;
      background: radial-gradient(ellipse at top, rgba(255, 214, 110, 0.45) 0%, rgba(255, 214, 110, 0.1) 45%, transparent 70%);
      clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* Login Form UI */
    .login-form {
      width: 100%;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      margin-top: -10px;
      opacity: 0.15;
      transform: translateY(15px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .login-form h2 {
      color: #fff;
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      color: #8a8d93;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 0.95rem;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 0.5rem;
      border: none;
      border-radius: 10px;
      background: #d4a373;
      color: #121417;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    /* LIGHT ON STATE */
    body.is-on {
      background: #0d0f12;
    }

    body.is-on .lamp-shade {
      fill: #f5f0e6;
    }

    body.is-on .bulb {
      fill: #ffdb8a;
      filter: drop-shadow(0 0 10px #ffdb8a);
    }

    body.is-on .light-cone {
      opacity: 1;
    }

    body.is-on .login-form {
      opacity: 1;
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 214, 110, 0.2);
      box-shadow: 0 0 35px rgba(255, 214, 110, 0.15);
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- SVG Lamp Structure -->
    <div class="lamp-wrapper">
      <svg class="lamp-svg" viewBox="0 0 100 120">
        <rect x="49" y="0" width="2" height="40" fill="#666" />
        <path d="M 30 40 L 70 40 L 80 70 L 20 70 Z" class="lamp-shade" />
        <rect x="42" y="70" width="16" height="5" rx="2" fill="#d1ccc2" />
        <circle cx="50" cy="78" r="4" class="bulb" />
      </svg>
      
      <!-- Pull Cord -->
      <div class="cord-hit" id="cord">
        <div class="cord-line"></div>
        <div class="cord-bead"></div>
      </div>
      
      <!-- Light Cone Effect -->
      <div class="light-cone"></div>
    </div>

    <!-- Animated Glassmorphism Login Form -->
    <form class="login-form" onsubmit="return false;">
      <h2>Welcome</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" placeholder="Enter name" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter Password" required>
      </div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
  </div>

  <script>
    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const cord = document.getElementById('cord');
    const body = document.body;

    let isOn = false;

    cord.addEventListener('click', () => {
      // Cord Pull Animation
      cord.style.transform = 'translateY(12px)';
      
      setTimeout(() => {
        cord.style.transform = 'translateY(0)';
        isOn = !isOn;
        
        // Toggle Light State
        if (isOn) {
          body.classList.add('is-on');
        } else {
          body.classList.remove('is-on');
        }
      }, 120);
    });
  </script>
</body>
</html>
