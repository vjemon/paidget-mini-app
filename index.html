<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paidget B2B Portal</title>
  <!-- Telegram Web App SDK Connector -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 380px;
      padding: 20px;
      text-align: center;
    }

    .portal-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .portal-header h2 {
      font-size: 22px;
      color: #58a6ff;
      margin-bottom: 8px;
    }

    .portal-header p {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: #58a6ff;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #238636;
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #2ea043;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="portal-card">
      <div class="portal-header">
        <h2>Paidget B2B Portal</h2>
        <p>Enter your 8-digit secret key to access</p>
      </div>

      <form id="accessForm">
        <div class="input-group">
          <input type="text" id="secretInput" placeholder="XXXX-XXXX" required autocomplete="off">
        </div>
        <button type="submit" class="submit-btn">Unlock Portal</button>
      </form>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // আপনার ১০টি সিক্রেট কোডের তালিকা
    const ALLOWED_SECRET_CODES = [
      "PG7K-X4PG",
      "K9QM-2P7X",
      "T4GX-8K2M",
      "P6ZR-M9Q4",
      "X3KP-7G8T",
      "M8QW-4P6K",
      "G2TX-K7R9",
      "Q5PM-X8G3",
      "R7K4-P2XM",
      "Z9GT-M6Q8"
    ];

    const form = document.getElementById('accessForm');
    
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const userInput = document.getElementById('secretInput').value.trim().toUpperCase();

      if (ALLOWED_SECRET_CODES.includes(userInput)) {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.showAlert("✅ Access Granted! Welcome to Paidget.", function() {
            window.Telegram.WebApp.close(); // ওকে চাপলে মিনি অ্যাপ বন্ধ হয়ে চ্যাটে ফিরে যাবে
          });
        } else {
          alert("✅ Access Granted! Welcome to Paidget.");
        }
      } else {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.showAlert("❌ Invalid Secret Code! Please try again.");
        } else {
          alert("❌ Invalid Secret Code! Please try again.");
        }
      }
    });
  </script>
</body>
</html>
